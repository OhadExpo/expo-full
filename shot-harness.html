<!doctype html>
<html>
<head><meta charset="utf-8"><title>shot harness</title></head>
<body style="background:#111;color:#eee;font:13px monospace">
<div id="out">idle</div>
<script type="module">
  import { captureShotFrames } from '/src/shotCapture.js';
  import { buildSeries, detectShots, detectShootingHand, analyzeShotClip } from '/src/shotAnalysis.js';
  import { findPeaks } from '/src/repCounter.js';
  const median = (a) => { const x = a.filter((v) => Number.isFinite(v)).sort((p, q) => p - q); return x.length ? x[Math.floor(x.length / 2)] : null; };

  const out = document.getElementById('out');
  const say = (m) => { out.textContent = m; };

  window.runHarness = async (url, opts = {}) => {
    // `deterministic` steps the clip with seeks instead of reading a playing
    // video. Slower, but it sees every frame regardless of machine load - which
    // is the whole question, since the same clip returns 11, 10 or 9 shots on
    // the default path. window.runHarness(url, { deterministic: true }) to try it.
    const frames = await captureShotFrames(url, { onProgress: (p, l) => say(p + '% ' + l), deterministic: opts.deterministic === 'coarse' ? 'coarse' : !!opts.deterministic });
    window.__frames = frames;
    const hand = detectShootingHand(frames) || 'R';
    const series = buildSeries(frames, { hand, aspect: (frames.dims.w / frames.dims.h) });
    const span = (frames[frames.length - 1].t - frames[0].t) / 1000;
    const fps = frames.fps || (frames.length - 1) / span;

    const torsoRef = median(series.sm.torso) || 0.15;
    const peakSets = {};
    for (const pr of [0.35, 0.25, 0.18, 0.12]) {
      const pk = findPeaks(series.sm.wristY, torsoRef * pr, Math.max(2, Math.round(fps * 0.5)));
      peakSets['prom' + pr] = pk.map((p) => Math.round(series.tMs[p.idx]));
    }
    const sweep = {};
    for (const ae of [95, 88, 80, 72, 60]) {
      const d = [];
      const cy = detectShots(series, fps, { debug: d, minArmElev: ae });
      sweep['armElev' + ae] = { n: cy.length, t: cy.map((c) => Math.round(series.tMs[c.release])) };
    }
    const dbg = [];
    const cycles = detectShots(series, fps, { debug: dbg });
    const dbg2 = [];
    const relaxedCycles = detectShots(series, fps, { debug: dbg2, minArmElev: 70, minElbow: 92, maxDipKnee: 173, dipWindowMs: 2400, requireAboveHead: false });
    const res = analyzeShotClip(frames, { hand });

    const r = {
      duration: frames.stats.duration,
      stats: frames.stats,
      windows: (frames.windows || []).map((w) => [Math.round(w.from), Math.round(w.to)]),
      frameCount: frames.length,
      fps: Math.round(fps * 10) / 10,
      hand,
      torsoRef: Math.round(torsoRef * 1000) / 1000,
      peakSets,
      sweep,
      strictShots: cycles.map((c) => Math.round(series.tMs[c.release])),
      strictRejects: dbg.map((d) => d.t + ' ' + d.reason),
      relaxedShots: relaxedCycles.map((c) => Math.round(series.tMs[c.release])),
      relaxedRejects: dbg2.map((d) => d.t + ' ' + d.reason),
      // Bump this string whenever this page changes. The runner asserts the
      // LIVE page reports it, because Vite caches the transform of an inline
      // module script and does not always invalidate it when the html
      // changes — a long-lived dev server then serves harness code older
      // than the file on disk, and every run silently tests the wrong thing.
      harnessBuild: 'wristtrack-1',
      // Raw ball track for the FIRST tracked shot, so the 1.75x scale error can
      // be reasoned about from real numbers instead of theory: the samples, the
      // time span, the fitted acceleration and what they imply.
      ballDebug: (() => {
        if (!res.ok) return null;
        const s1 = res.shots.find((x) => x.info && x.info.ballSamples > 0);
        if (!s1) return null;
        const cands = series.raw && series.raw.ball;
        const rel = s1.cycle.release;
        const out = [];
        for (let k = rel; k < Math.min(cands.length, rel + 30); k++) {
          const c = cands[k];
          // ALL candidates, not blobs[0] — the tracker CHOOSES among them, so
          // dumping the first one describes a path nothing followed.
          if (Array.isArray(c) && c.length) out.push({ t: Math.round(series.tMs[k]), b: c.map((z) => [+z.x.toFixed(4), +z.y.toFixed(4), +z.w.toFixed(4), +z.h.toFixed(4)]) });
        }
        const wp = series.raw.wristPos && series.raw.wristPos[rel];
        return { index: s1.index, releaseT: Math.round(series.tMs[rel]), aspect: series.aspect, wrist: wp ? [+wp.x.toFixed(4), +wp.y.toFixed(4)] : null,
                 deg: s1.info.ballLaunchDeg, speed: s1.info.ballSpeedMs, rise: s1.info.ballRiseM,
                 n: s1.info.ballSamples, fit: s1.info.ballLaunchFit, frames: out };
      })(),
      // Same dump for the first shot whose ball track was REJECTED. That is
      // the one worth studying — a rejection means the tracker chose an arc the
      // physics gates threw out, and the candidates it chose among are the only
      // way to see what it should have picked instead. Saved as a fixture so
      // the fix can be iterated with a unit test instead of a 5-minute run.
      ballDebugFailed: (() => {
        if (!res.ok) return null;
        const sf = res.shots.find((x) => x.info && !(x.info.ballSamples > 0));
        if (!sf) return null;
        const cands = series.raw && series.raw.ball;
        const rel = sf.cycle.release;
        const out = [];
        for (let k = rel; k < Math.min(cands.length, rel + 30); k++) {
          const c = cands[k];
          if (Array.isArray(c) && c.length) out.push({ t: Math.round(series.tMs[k]), b: c.map((z) => [+z.x.toFixed(4), +z.y.toFixed(4), +z.w.toFixed(4), +z.h.toFixed(4)]) });
        }
        const wp = series.raw.wristPos && series.raw.wristPos[rel];
        // The wrist MOVES across the window - by 200ms after the detected
        // release the arm has fully extended. A single wrist point made every
        // distance-from-hand measured downstream compare against a stale
        // position, which is why the origin probes could not settle anything.
        // Dump the whole track, one entry per dumped frame.
        const wristTrack = [];
        for (let k = rel; k < Math.min(cands.length, rel + 30); k++) {
          const c = cands[k];
          if (!(Array.isArray(c) && c.length)) continue;
          const w2 = series.raw.wristPos && series.raw.wristPos[k];
          wristTrack.push(w2 ? [Math.round(series.tMs[k]), +w2.x.toFixed(4), +w2.y.toFixed(4)] : [Math.round(series.tMs[k]), null, null]);
        }
        return { index: sf.index, releaseT: Math.round(series.tMs[rel]), aspect: series.aspect,
                 wrist: wp ? [+wp.x.toFixed(4), +wp.y.toFixed(4)] : null,
                 wristTrack,
                 why: sf.info.ballWhy, frames: out };
      })(),
      analyzed: res.ok ? res.shots.map((s) => ({ i: s.index, t: Math.round(series.tMs[s.cycle.release]), score: s.score, ballDeg: s.info.ballLaunchDeg, ballFit: s.info.ballLaunchFit, ballN: s.info.ballSamples, speed: s.info.ballSpeedMs, rise: s.info.ballRiseM, why: s.info.ballWhy, recede: s.info.ballRecede, oblique: s.info.ballOblique })) : null,
      ballFramesSeen: frames.filter((f) => f.blobs && f.blobs.length).length,
      // How far the nearest moving blob is from the shooting hand, in ball
      // diameters, over the frames right after each release. This is the number
      // the origin constraint compares against.
      originProbe: cycles.map((c) => {
        const wp = series.raw.wristPos[c.release];
        if (!wp) return 'noWrist';
        const out = [];
        for (let k = c.release; k < Math.min(series.raw.ball.length, c.release + 12); k++) {
          const bs = series.raw.ball[k];
          if (!bs || !bs.length) { out.push('-'); continue; }
          let bestD = 1e9, px = 1;
          for (const b of bs) {
            const d = Math.hypot(b.x - wp.x, b.y - wp.y);
            if (d < bestD) { bestD = d; px = (b.w + b.h) / 2; }
          }
          out.push((bestD / Math.max(px, 1e-9)).toFixed(1));
        }
        return Math.round(series.tMs[c.release]) + ': ' + out.join(' ');
      }),
      error: res.error || null,
    };
    say('done: ' + (r.analyzed ? r.analyzed.length : 0) + ' shots');
    window.__RESULT = r;
    return r;
  };
  window.__ready = true;
  say('ready');
</script>
</body>
</html>
