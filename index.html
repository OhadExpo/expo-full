<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0a0a0b"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="EXPO"/>
  <link rel="apple-touch-icon" href="/icon-180.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <title>EXPO</title>
  <!-- Preconnect to Supabase so the first auth + plans query doesn't pay
       the full TCP+TLS handshake cost on a cold visit. -->
  <link rel="preconnect" href="https://gtcbfglttoiyfsnfbhdy.supabase.co" crossorigin/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet"/>
  <!-- Preload the two Nord weights actually used at first paint so the
       UI shell isn't gated on a second roundtrip for woff2 fetch. -->
  <link rel="preload" href="/fonts/Nord-Regular.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/fonts/Nord-Bold.woff2"    as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/nord-fonts.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;font-family:'Nord','Heebo','DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
    ::selection{background:#39BDFF30;color:#fff}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0a0a0a}
    ::-webkit-scrollbar-thumb{background:#1a1a1e;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#39BDFF40}
    input,select,textarea{font-family:'Nord','Heebo','DM Sans',system-ui,sans-serif;text-align:center}
    /* Native <select> dropdown options. Without this, Chrome/Edge renders
       options using OS theme — on dark Windows themes the unselected items
       render as low-contrast grey-on-grey, which is unreadable in our dark
       UI (the athlete picker on /coach/programs was the worst offender).
       Forcing the dark surface + white text gives a consistent, readable
       dropdown without replacing every <select> with a custom component. */
    select{color:#fff;background:#0a0a0b}
    select option{background:#0a0a0b;color:#fff}
    select option:disabled{color:#666}
    select option:checked,select option:hover{background:#39BDFF30;color:#fff}
    /* Hide spinner buttons on number inputs so the centered text stays
       visually centered (otherwise the spinner area shifts the centered
       glyph slightly to the left). */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}

    /* Mobile responsive */
    @media(max-width:768px){
      nav::-webkit-scrollbar{display:none}
      table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
      table th,table td{padding:8px 6px!important;font-size:11px!important}
    }
    @media(max-width:480px){
      header nav button span{font-size:11px!important}
      header nav button{padding:4px 8px!important}
    }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
