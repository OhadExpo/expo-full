<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0a0a0b"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="EXPO"/>
  <link rel="apple-touch-icon" href="/icon-180.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
  <link rel="shortcut icon" href="/favicon.ico"/>
  <title>EXPO</title>
  <!-- Preconnect to Supabase so the first auth + plans query doesn't pay
       the full TCP+TLS handshake cost on a cold visit. -->
  <link rel="preconnect" href="https://gtcbfglttoiyfsnfbhdy.supabase.co" crossorigin/>
  <!-- Preload the two Nord weights actually used at first paint so the
       UI shell isn't gated on a second roundtrip for woff2 fetch. -->
  <link rel="preload" href="/fonts/Nord-Regular.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/fonts/Nord-Bold.woff2"    as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/nord-fonts.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;font-family:'Nord','DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
    ::selection{background:#39BDFF30;color:#fff}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0a0a0a}
    ::-webkit-scrollbar-thumb{background:#1a1a1e;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#39BDFF40}
    input,select,textarea{font-family:'Nord','DM Sans',system-ui,sans-serif}

    /* Mobile responsive */
    @media(max-width:768px){
      nav::-webkit-scrollbar{display:none}
      table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
      table th,table td{padding:8px 6px!important;font-size:11px!important}
    }
    @media(max-width:480px){
      header nav button span{font-size:11px!important}
      header nav button{padding:4px 8px!important}
    }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
