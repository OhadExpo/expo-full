<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="EXPO — Programmed training templates by Ohad. Block periodisation for hypertrophy, strength, rehab, couples, and home setups."/>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="shortcut icon" href="/favicon.ico"/>

  <!-- Open Graph / share preview -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="EXPO"/>
  <meta property="og:title" content="EXPO · Programmed Training"/>
  <meta property="og:description" content="Block-periodised training templates by Ohad. Same engine I use with private clients — now available as standalone purchases."/>
  <meta property="og:url" content="https://expo-il.co.il/"/>
  <meta property="og:image" content="https://expo-il.co.il/og-cover.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:locale" content="he_IL"/>
  <meta property="og:locale:alternate" content="en_US"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="EXPO · Programmed Training"/>
  <meta name="twitter:description" content="Block-periodised training templates by Ohad."/>
  <meta name="twitter:image" content="https://expo-il.co.il/og-cover.png"/>

  <title>EXPO · Programmed Training</title>

  <!-- hreflang alternates so Google understands /he and /en as language
       variants of the same page (default Hebrew at the root). -->
  <link rel="alternate" hreflang="he" href="https://expo-il.co.il/he"/>
  <link rel="alternate" hreflang="en" href="https://expo-il.co.il/en"/>
  <link rel="alternate" hreflang="x-default" href="https://expo-il.co.il/"/>

  <!-- PWA manifest + iOS standalone hints so the page is installable to the
       home screen, parity with the coach app's PWA. -->
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="EXPO"/>

  <!-- Preload the assets that block first paint: Nord (text rendering) +
       the hero EXPO mark (above-the-fold image). -->
  <link rel="preload" href="/fonts/Nord-Regular.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/fonts/Nord-Bold.woff2"    as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/expo-hero-logo.png"       as="image" fetchpriority="high"/>

  <link rel="stylesheet" href="/nord-fonts.css"/>

  <!-- Heebo (Hebrew) — self-hosted woff2 because our CSP blocks Google
       Fonts CDN (style-src 'self' + font-src 'self'). Mirrors the
       coach-app heebo-fonts.css. Without Heebo the Hebrew glyphs fall
       through to a system serif (Nord doesn't ship Hebrew). -->
  <link rel="preload" href="/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/heebo-fonts.css"/>

  <!-- Sitewide structured data — tells Google / WhatsApp this is a real
       brand with a specific operator + locale. Per-program Product schema
       is injected client-side from src/App.jsx on the /#/programs/<id>
       route, AND server-side in the static /programs/<id>.html pages. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "EXPO",
    "alternateName": "EXPO · Programmed Training",
    "url": "https://expo-il.co.il",
    "inLanguage": ["he", "en"]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "EXPO",
    "url": "https://expo-il.co.il",
    "logo": "https://expo-il.co.il/expo-hero-logo.png",
    "founder": { "@type": "Person", "name": "Ohad Yossifoff" },
    "sameAs": [
      "https://www.instagram.com/ohadaptable/"
    ]
  }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000000;color:#f0f0f4;font-family:'Nord','DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    ::selection{background:#39BDFF30;color:#fff}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:#000000}
    ::-webkit-scrollbar-thumb{background:#1e1e24;border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#39BDFF40}
    a{color:inherit;text-decoration:none}
    button{font:inherit}

    /* Hide the EXPO wordmark on narrow phones — the X glyph alone is recognisable
       and frees up enough horizontal room for the three nav links to share a line. */
    @media (max-width: 479px) {
      .fv-wordmark { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
